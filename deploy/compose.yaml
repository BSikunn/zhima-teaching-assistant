name: zhima

x-runtime: &runtime
  image: zhima-runtime:2026-10-29
  build:
    context: ..
    dockerfile: deploy/Dockerfile
    target: runtime
  restart: unless-stopped
  init: true
  volumes:
    - ../data/container:/app/data
    - ../logs/container:/app/logs
    - ../.cache/container:/app/.cache
    - ../.cache/backups:/app/.cache/backups

x-app-env: &app-env
  PYTHONPATH: /app/backend
  DATA_DIR: /app/data
  DATABASE_URL: mysql+pymysql://zhima:${MYSQL_PASSWORD:?Run deploy.ps1 -Action init}@mysql:3306/zhima?charset=utf8mb4
  JWT_SECRET: ${JWT_SECRET:?Run deploy.ps1 -Action init}
  AI_MODE: deepseek
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?Set DEEPSEEK_API_KEY in project .env}
  DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
  DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-flash}
  WEB_SEARCH_ENABLED: ${WEB_SEARCH_ENABLED:-true}
  WEB_SEARCH_PROVIDER: ddgs
  WEB_SEARCH_BACKEND: ${WEB_SEARCH_BACKEND:-yahoo}
  WEB_SEARCH_TIMEOUT: "10"
  WEB_SEARCH_MAX_RESULTS: "3"
  TASK_MODE: celery
  REDIS_URL: redis://redis:6379/0
  STORAGE_BACKEND: minio
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Run deploy.ps1 -Action init}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Run deploy.ps1 -Action init}
  MINIO_BUCKET: zhima
  MINIO_SECURE: "false"
  RETRIEVAL_BACKEND: vector
  INDEX_URL: http://index:8767
  INDEX_TOKEN: ${INDEX_TOKEN:?Run deploy.ps1 -Action init}
  EMBEDDING_MODEL_PATH: /app/models/bge-small-zh-v1.5
  JUDGE0_URL: ${JUDGE0_URL:-}
  JUDGE0_KEY: ${JUDGE0_KEY:-}
  NLTK_DATA: /app/.cache/nltk
  TIKTOKEN_CACHE_DIR: /app/.cache/tiktoken
  HF_HOME: /app/.cache/huggingface
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  XDG_CACHE_HOME: /app/.cache
  TORCH_HOME: /app/.cache/torch
  TMPDIR: /app/.cache/tmp

services:
  mysql:
    image: mysql:8.0.43
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: zhima
      MYSQL_USER: zhima
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Run deploy.ps1 -Action init}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Run deploy.ps1 -Action init}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - ../data/mysql:/var/lib/mysql
      - ../.cache/backups/compose:/backups
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysql -h 127.0.0.1 -u root -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4.5-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", ""]
    volumes:
      - ../data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?Run deploy.ps1 -Action init}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Run deploy.ps1 -Action init}
      MINIO_BROWSER: "off"
    volumes:
      - ../data/minio:/data
    healthcheck:
      test: ["CMD-SHELL", "mc alias set health http://127.0.0.1:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\" >/dev/null 2>&1 && mc ready health >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 30

  index:
    <<: *runtime
    command: ["python", "-m", "uvicorn", "app.index_server:create_app", "--factory", "--host", "0.0.0.0", "--port", "8767"]
    environment:
      PYTHONPATH: /app/backend
      DATA_DIR: /app/data
      INDEX_TOKEN: ${INDEX_TOKEN:?Run deploy.ps1 -Action init}
      EMBEDDING_MODEL_PATH: /app/models/bge-small-zh-v1.5
      NLTK_DATA: /app/.cache/nltk
      TIKTOKEN_CACHE_DIR: /app/.cache/tiktoken
      HF_HOME: /app/.cache/huggingface
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      XDG_CACHE_HOME: /app/.cache
      TORCH_HOME: /app/.cache/torch
      TMPDIR: /app/.cache/tmp
    volumes:
      - ../data/chroma:/app/data
      - ../models:/app/models:ro
      - ../logs/index:/app/logs
      - ../.cache/container-index:/app/.cache
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8767/health',headers={'Authorization':'Bearer '+os.environ['INDEX_TOKEN']}); urllib.request.urlopen(r,timeout=5)"]
      interval: 15s
      timeout: 10s
      start_period: 120s
      retries: 30

  app:
    <<: *runtime
    environment: *app-env
    command: ["python", "-m", "uvicorn", "app.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8765"]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
      index: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/api/health',timeout=5)"]
      interval: 10s
      timeout: 7s
      start_period: 60s
      retries: 30

  worker:
    <<: *runtime
    environment: *app-env
    command: ["celery", "-A", "app.jobs:celery_app", "worker", "--loglevel=info", "--concurrency=1", "--hostname=worker@%h"]
    depends_on:
      app: {condition: service_healthy}
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.jobs:celery_app inspect ping -d worker@$$HOSTNAME --timeout 5 >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5

  nginx:
    image: zhima-web:2026-10-29
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:-8765}:80"
    volumes:
      - ../logs/nginx:/var/log/nginx
    depends_on:
      app: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
